<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1d1712">
  <title>YAMAYA タブレットシステム</title>
  <link rel="icon" href="assets/icon.svg">
  <link rel="stylesheet" href="common/base.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; overflow: auto; }
    .wrap { text-align: center; padding: 24px; }
    h1 { letter-spacing: .15em; margin: 0 0 8px; }
    p { color: var(--ink-dim); }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-top: 28px; }
    a.tile { display: block; padding: 28px; border-radius: 18px; background: var(--surface); color: var(--ink); text-decoration: none; }
    a.tile b { display: block; font-size: 1.4rem; margin-bottom: 6px; }
    a.tile span { color: var(--ink-dim); font-size: .9rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>YAMAYA</h1>
    <p>この端末の役割を選んでください（キオスク設定時は各URLを直接開きます）</p>
    <div class="grid">
      <a class="tile" href="customer/"><b>カスタマーOS</b><span>客席のメニュー・注文</span></a>
      <a class="tile" href="kitchen/"><b>厨房OS</b><span>注文受付・売上・在庫</span></a>
      <a class="tile" href="tools/hotspot-editor.html"><b>ホットスポット編集</b><span>メニュー画像のタップ範囲を設定</span></a>
    </div>
  </div>
  <script src="config.js"></script>
  <script src="common/sw-register.js"></script>
</body>
</html>
