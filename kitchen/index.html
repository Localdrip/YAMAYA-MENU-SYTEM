<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1d1712">
  <title>YAMAYA 厨房</title>
  <link rel="manifest" href="../manifest-kitchen.webmanifest">
  <link rel="icon" href="../assets/icon.svg">
  <link rel="stylesheet" href="../common/base.css">
  <link rel="stylesheet" href="kitchen.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">YAMAYA <small>厨房</small></div>
    <nav class="tabs" id="tabs">
      <button data-view="orders" class="active">注文 <span class="badge" id="newCount">0</span></button>
      <button data-view="sales">売上</button>
      <button data-view="inventory">在庫</button>
      <button data-view="soldout">品切れ設定</button>
    </nav>
    <div class="spacer"></div>
    <span id="net" class="net">接続確認中</span>
    <span class="clock" id="clock"></span>
  </header>

  <main>
    <section class="view" id="view-orders">
      <div class="board">
        <div class="col"><h3>新規 <span id="cnt-new"></span></h3><div class="cards" id="col-new"></div></div>
        <div class="col"><h3>調理中 <span id="cnt-cooking"></span></h3><div class="cards" id="col-cooking"></div></div>
        <div class="col"><h3>提供済み <span id="cnt-served"></span></h3><div class="cards" id="col-served"></div></div>
      </div>
    </section>

    <section class="view hidden" id="view-sales">
      <div class="toolbar"><h2>売上</h2><button id="reloadSales">更新</button></div>
      <div class="kpis" id="kpis"></div>
      <div class="split">
        <div class="panel"><h3>日別売上（直近14日）</h3><div id="dailyChart" class="bars"></div></div>
        <div class="panel"><h3>本日の商品別</h3><table class="tbl" id="byItem"></table></div>
      </div>
    </section>

    <section class="view hidden" id="view-inventory">
      <div class="toolbar"><h2>在庫</h2><button id="reloadInv">更新</button></div>
      <table class="tbl" id="invTable"></table>
    </section>

    <section class="view hidden" id="view-soldout">
      <div class="toolbar"><h2>品切れ設定</h2><p class="hint">タップで切り替え。客席タブレットに約30秒で反映されます。</p></div>
      <div class="sogrid" id="soGrid"></div>
    </section>
  </main>

  <div class="startscreen" id="start">
    <div>
      <p class="big">厨房OS</p>
      <p>タップして開始（通知音を有効にします）</p>
      <button class="primary big" id="startBtn">開始</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="../config.js"></script>
  <script src="../common/api.js"></script>
  <script src="../common/sw-register.js"></script>
  <script src="kitchen.js"></script>
</body>
</html>
